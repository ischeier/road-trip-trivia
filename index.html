  .chip.on{background:var(--card);border-color:var(--accent);color:var(--accent);font-weight:600}
  .names{display:flex;gap:10px}
  .names input{flex:1;min-width:0;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:14px;font-size:17px;color:var(--ink);font-family:inherit}

  .check{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:16px;color:var(--ink)}
  .check i{width:26px;height:26px;border-radius:8px;border:1.5px solid #3a4c78;display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:#14213d;flex:none}
  .check.on i{background:var(--accent);border-color:var(--accent)}
  .dock{position:sticky;bottom:0;margin:auto -18px 0;padding:14px 18px max(16px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 75%,rgba(20,33,61,0))}
  .primary{display:block;width:100%;background:var(--accent);color:#14213d;border:0;border-radius:16px;padding:18px;font-size:19px;font-weight:700;font-family:inherit}
  .primary:disabled{opacity:.4}
  .secondary{display:block;width:100%;background:transparent;color:var(--ink);border:1.5px solid #3a4c78;border-radius:16px;padding:16px;font-size:18px;font-weight:600;margin-top:10px;font-family:inherit}
  .ghost{display:block;margin:8px auto 0;background:none;border:0;color:var(--mute);font-size:16px;padding:12px;text-decoration:underline;font-family:inherit}
  .board{display:flex;justify-content:space-between;align-items:stretch;gap:10px;margin-top:4px}
  .pl{flex:1;background:var(--card);border-radius:14px;padding:10px 12px;border:2px solid transparent;min-width:0}
  .pl.act{border-color:var(--accent)}
  .pl b{display:block;font-size:14px;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl span{font-size:28px;font-weight:800}
  .meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin:14px 2px 10px}
  .card{background:var(--card);border-radius:22px;padding:26px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;animation:flip .28s ease-out;border:2px solid transparent}
  .card.late{border-color:var(--bad)}
  .card .cat{color:var(--accent);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:12px}
  .card .q{font-size:26px;line-height:1.25;font-weight:700;margin:0}
  .card .a{font-size:34px;line-height:1.15;font-weight:800;color:var(--good);margin:14px 0 0}
  .card .qs{font-size:16px;color:var(--mute);margin:0}
  .count{font-size:88px;font-weight:800;color:var(--accent);margin:6px 0 0;line-height:1}
  .count.low{color:var(--bad)}
  .turn{font-size:20px;font-weight:700;margin:4px 0 12px;text-align:center}
  @keyframes flip{from{transform:rotateY(80deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
  .big{font-size:56px;font-weight:800;color:var(--accent);margin:6px 0}
  .center{text-align:center}
  table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:10px}
  td,th{padding:9px 6px;text-align:right;border-bottom:1px solid #2a3a63}
  th{color:var(--mute);font-weight:600;font-size:13px}
  td:first-child,th:first-child{text-align:left}
  .g{color:var(--good)}.r{color:var(--bad)}
  .spacer{flex:1}
</style>
</head>

var CATS=[];Q.forEach(function(x){if(CATS.indexOf(x.c)<0)CATS.push(x.c);});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ---------- storage: localStorage when allowed, memory otherwise ---------- */
var memStore=null, canSave=true;
function load(){
  try{var s=window.localStorage.getItem(STORE_KEY);if(s){var o=JSON.parse(s);if(o&&o.rec)return o;}}catch(e){canSave=false;}
  return memStore||{rec:{},names:['',''],mode:'study',timer:10,cat:'__all',hideRight:false};
}
var S=load();
function save(){memStore=S;try{window.localStorage.setItem(STORE_KEY,JSON.stringify(S));canSave=true;}catch(e){canSave=false;}}
function rec(name){if(!S.rec[name])S.rec[name]={};return S.rec[name];}
function pname(i){return (S.names[i]||'').trim()||('Player '+(i+1));}
function missedCount(){
  var n=0;Q.forEach(function(x){if(rec(pname(0))[x.id]==='w'||rec(pname(1))[x.id]==='w')n++;});return n;
}

/* ---------- audio beep (needs a tap first on iOS) ---------- */
var AC=null;
function prepAudio(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=660;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.6);o.start();o.stop(AC.currentTime+.6);}catch(e){}try{if(navigator.vibrate)navigator.vibrate(300);}catch(e){}}

var app=document.getElementById('app');
var G=null, tick=null;
function stopTick(){if(tick){clearInterval(tick);tick=null;}}

/* ---------- HOME ---------- */
function home(){
  stopTick();G=null;
  if(S.cat==='__missed'&&missedCount()===0){S.cat='__all';save();}
  var catChips=['__all'].concat(CATS).concat(['__missed']).map(function(k){
    var label=k==='__all'?'All · shuffle ('+Q.length+')':k==='__missed'?'Missed deck ('+missedCount()+')':k;
    return '<button class="chip'+(S.cat===k?' on':'')+'" data-cat="'+esc(k)+'">'+esc(label)+'</button>';
  }).join('');
  app.innerHTML=
    '<h1>Road Trip Trivia</h1><p class="sub">Two players, one phone, no service needed.</p>'+
    '<div class="label">Mode</div><div class="chips">'+
      '<button class="chip'+(S.mode==='study'?' on':'')+'" data-mode="study">Study (flip cards)</button>'+
      '<button class="chip'+(S.mode==='battle'?' on':'')+'" data-mode="battle">Battle (timer)</button></div>'+
    '<div class="label">Players</div><div class="names">'+
      '<input id="n0" placeholder="Player 1" value="'+esc(S.names[0]||'')+'" maxlength="14" autocapitalize="words">'+
      '<input id="n1" placeholder="Player 2" value="'+esc(S.names[1]||'')+'" maxlength="14" autocapitalize="words"></div>'+
    '<div class="label">Questions</div><div class="chips" id="cats">'+catChips+'</div>'+
    '<div id="battleOpts"></div>'+
    '<div id="hideOpt"></div>'+
    '<div style="height:18px"></div>'+
    '<div class="dock"><button class="primary" id="go">Start</button>'+
    '<button class="ghost" id="stats">Stats</button></div>';
  function drawOpts(){
    document.getElementById('battleOpts').innerHTML = S.mode==='battle' ?
      '<div class="label">Time per answer</div><div class="chips">'+
      [5,10].map(function(t){return '<button class="chip'+(S.timer===t?' on':'')+'" data-t="'+t+'">'+t+' seconds</button>';}).join('')+'</div>' : '';
    document.getElementById('hideOpt').innerHTML = S.cat==='__missed' ? '' :
      '<div class="check'+(S.hideRight?' on':'')+'" id="hide" role="button"><i>'+(S.hideRight?'✓':'')+'</i>Skip questions a player already got right</div>';
    app.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){S.timer=+b.getAttribute('data-t');save();drawOpts();};});
    var h=document.getElementById('hide');if(h)h.onclick=function(){S.hideRight=!S.hideRight;save();drawOpts();};
  }
  drawOpts();
  app.querySelectorAll('[data-mode]').forEach(function(b){b.onclick=function(){S.mode=b.getAttribute('data-mode');save();home();};});
  app.querySelectorAll('[data-cat]').forEach(function(b){b.onclick=function(){S.cat=b.getAttribute('data-cat');save();home();};});
  function readNames(){S.names=[document.getElementById('n0').value,document.getElementById('n1').value];save();}
  document.getElementById('n0').onchange=readNames;document.getElementById('n1').onchange=readNames;
  document.getElementById('n0').oninput=readNames;document.getElementById('n1').oninput=readNames;
  document.getElementById('stats').onclick=function(){readNames();statsScreen();};
  var go=document.getElementById('go');
  go.onclick=function(){readNames();prepAudio();startSession();};
}

/* ---------- SESSION ---------- */
function startSession(){
  var names=[pname(0),pname(1)];
  if(names[0]===names[1]){names[1]=names[1]+' 2';}
  G={mode:S.mode,timer:S.timer,names:names,turn:0,scores:[0,0],asked:[0,0],cur:null,phase:'front',left:0,missed:S.cat==='__missed',late:false,count:0};
  if(G.missed){
    G.queues=[0,1].map(function(i){return shuffle(Q.filter(function(x){return rec(names[i])[x.id]==='w';}));});
    if(!G.queues[0].length&&!G.queues[1].length){return home();}
  }else{
    G.deck=shuffle(Q.filter(function(x){return S.cat==='__all'||x.c===S.cat;}));
  }
  if(!nextCard()) return results();
  drawCard();
}
function nextCard(){
  var p=G.turn;
  if(G.missed){
    if(!G.queues[p].length){p=1-p;if(!G.queues[p].length)return false;G.turn=p;}
    G.cur=G.queues[p].shift();
  }else{
    var idx=-1,r=rec(G.names[p]);
    for(var i=0;i<G.deck.length;i++){if(!(S.hideRight&&r[G.deck[i].id]==='r')){idx=i;break;}}
    if(idx<0){var o=1-p;r=rec(G.names[o]);for(var j=0;j<G.deck.length;j++){if(!(S.hideRight&&r[G.deck[j].id]==='r')){idx=j;p=o;break;}}}
    if(idx<0)return false;
    G.turn=p;G.cur=G.deck.splice(idx,1)[0];
  }
  G.phase='front';G.late=false;G.left=G.timer;
  return true;
}
function board(){
  return '<div class="board">'+[0,1].map(function(i){
    return '<div class="pl'+(G.turn===i?' act':'')+'"><b>'+esc(G.names[i])+'</b><span>'+G.scores[i]+'</span></div>';
  }).join('')+'</div>';
}
function drawCard(){
  stopTick();
  var c=G.cur, who=G.names[G.turn], html='';
  html+=board();
  html+='<div class="meta"><span>'+esc(who)+'\'s turn</span><span>'+(G.missed?'Missed deck · ':'')+(G.mode==='battle'?'Battle':'Study')+'</span></div>';
  var dock='';
  if(G.phase==='front'){
    html+='<div class="card"><div class="cat">'+esc(c.c)+'</div><p class="q">'+esc(c.q)+'</p></div>';
    if(G.mode==='battle') dock='<button class="primary" id="act">Start timer · '+G.timer+'s</button><button class="secondary" id="flip0">Flip without timer</button>';
    else dock='<button class="primary" id="act">Flip card</button>';
  }else if(G.phase==='running'){
    html+='<div class="card'+(G.late?' late':'')+'"><div class="cat">'+esc(c.c)+'</div><p class="qs">'+esc(c.q)+'</p>'+
      '<div class="count'+(G.left<=3?' low':'')+'" id="count">'+(G.late?'0':G.left)+'</div>'+
      (G.late?'<p class="qs" style="margin-top:8px">Time\'s up</p>':'')+'</div>';
    dock='<button class="primary" id="act">Flip card</button>';
  }else{
    html+='<div class="card"><div class="cat">'+esc(c.c)+'</div><p class="qs">'+esc(c.q)+'</p><p class="a">'+esc(c.a)+'</p></div>'+
      '<div class="turn" style="margin-top:14px">Did '+esc(who)+' get it?</div>';
    dock='<button class="primary" id="right">Got it</button><button class="secondary" id="wrong">Missed</button>';
  }
  html+='<div class="spacer"></div><div class="dock">'+dock+'<button class="ghost" id="end">End session</button></div>';
  app.innerHTML=html;
  var act=document.getElementById('act');
  if(G.phase==='front'&&G.mode==='battle'){
    act.onclick=startTimer;
    document.getElementById('flip0').onclick=function(){G.phase='back';drawCard();};
  }else if(G.phase==='front'){
    act.onclick=function(){G.phase='back';drawCard();};
  }else if(G.phase==='running'){
    act.onclick=function(){stopTick();G.phase='back';drawCard();};
  }else{
    document.getElementById('right').onclick=function(){mark(true);};
    document.getElementById('wrong').onclick=function(){mark(false);};
  }
  document.getElementById('end').onclick=function(){stopTick();results();};
}
function startTimer(){
  prepAudio();
  G.phase='running';G.left=G.timer;G.late=false;
  var end=Date.now()+G.timer*1000;
  drawCard();
  tick=setInterval(function(){
    var rem=Math.ceil((end-Date.now())/1000);
    if(rem<=0){stopTick();G.left=0;G.late=true;beep();drawCard();return;}
    if(rem!==G.left){G.left=rem;var el=document.getElementById('count');if(el){el.textContent=rem;el.className='count'+(rem<=3?' low':'');}}
  },100);
}
function mark(ok){
  var p=G.turn,c=G.cur,r=rec(G.names[p]);
  r[c.id]=ok?'r':'w';G.asked[p]++;G.count++;
  if(ok)G.scores[p]++;
  else if(G.missed)G.queues[p].push(c);
  save();
  G.turn=1-G.turn;
  if(!nextCard())return results();
  drawCard();
}

/* ---------- RESULTS ---------- */
function results(){
  stopTick();
  var n=G.names,s=G.scores,a=G.asked;
  var line;
  if(!G.count)line='No questions answered.';
  else if(s[0]===s[1])line='It\'s a tie.';
  else line=esc(s[0]>s[1]?n[0]:n[1])+' wins this round.';
  var m=missedCount();
  app.innerHTML=
    '<h2 class="center" style="margin-top:28px">Round over</h2>'+
    '<div class="center"><div class="big">'+s[0]+' – '+s[1]+'</div><p class="sub">'+line+'</p></div>'+
    '<table><tr><th></th><th>Right</th><th>Missed</th></tr>'+
    [0,1].map(function(i){return '<tr><td>'+esc(n[i])+'</td><td class="g">'+s[i]+'</td><td class="r">'+(a[i]-s[i])+'</td></tr>';}).join('')+'</table>'+
    '<div class="spacer"></div><div class="dock">'+
    '<button class="primary" id="again">Play again</button>'+
    (m?'<button class="secondary" id="miss">Practice missed ('+m+')</button>':'')+
    '<button class="ghost" id="home">Home</button></div>';
  document.getElementById('again').onclick=function(){startSession();};
  var mb=document.getElementById('miss');if(mb)mb.onclick=function(){S.cat='__missed';save();startSession();};
  document.getElementById('home').onclick=home;
  G.over=true;
}

/* ---------- STATS ---------- */
var confirmReset=false;
function statsScreen(){
  var players=Object.keys(S.rec).filter(function(k){return Object.keys(S.rec[k]).length;});
  var html='<h2>Stats</h2>';
  if(!players.length)html+='<p class="sub">Nothing yet. Play a round and your scores show up here.</p>';
  players.forEach(function(p){
    var r=S.rec[p],tr=0,tw=0,rows='';
    CATS.forEach(function(c){
      var cr=0,cw=0,tot=0;
      Q.forEach(function(x){if(x.c===c){tot++;if(r[x.id]==='r')cr++;else if(r[x.id]==='w')cw++;}});
      tr+=cr;tw+=cw;
      rows+='<tr><td>'+esc(c)+'</td><td class="g">'+cr+'</td><td class="r">'+cw+'</td><td>'+(tot-cr-cw)+'</td></tr>';
    });
    html+='<div class="label">'+esc(p)+' · '+tr+' right · '+tw+' to review</div>'+
      '<table><tr><th>Category</th><th>Right</th><th>Missed</th><th>New</th></tr>'+rows+'</table>';
  });
  html+='<p class="sub" style="font-size:14px">Right and Missed show each question\'s latest result. '+(canSave?'Saved on this phone.':'Stats last only while this page stays open.')+'</p>';
  html+='<div class="spacer"></div><div class="dock"><button class="primary" id="back">Back</button>'+
    (players.length?'<button class="ghost" id="reset">'+(confirmReset?'Tap again to erase all stats':'Reset stats')+'</button>':'')+'</div>';
  app.innerHTML=html;
  document.getElementById('back').onclick=function(){confirmReset=false;home();};
  var rs=document.getElementById('reset');
  if(rs)rs.onclick=function(){if(!confirmReset){confirmReset=true;statsScreen();return;}S.rec={};confirmReset=false;save();statsScreen();};
}

home();
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
